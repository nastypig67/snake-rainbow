# Builds the game for the browser with pygbag and publishes it to the gh-pages branch.
# Based on https://pygame-web.github.io/wiki/publishing/github.io/
name: pygbag_build

on:
  push:
    branches: [main]      # rebuild every time you push changes to the game
  workflow_dispatch:      # also lets you run it by hand from the Actions tab

permissions:
  contents: write         # needed so the job can push to the gh-pages branch

jobs:
  build-pygbag:
    name: Build snake_rainbow for the web
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build with pygbag
        run: |
          python -m pip install pygbag
          python -m pygbag --build $GITHUB_WORKSPACE/main.py

      - name: Publish build/web to the gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
